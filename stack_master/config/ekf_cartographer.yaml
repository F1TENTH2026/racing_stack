# robot_localization EKF for cartographer localization, fusing cartographer's
# /tracked_pose (via pose_to_odom_node) with wheel odometry. Produces
# /car_state/odom and owns the map TF -- cartographer_node itself does NOT
# (publish_to_tf = false in localization_2d.lua/mapping_2d.lua; see there).
#
# Same REP-105 split and same "frames must be distinct" requirement as
# ekf_pf.yaml (see its header for the full explanation and how it was verified
# -- this file had the identical odom_frame == base_link_frame bug):
#
#   map  -> odom       this node (publish_tf below)
#   odom -> base_link   vesc_to_odom, dead reckoning between corrections
#
# vesc_to_odom's publish_tf is switched on for this by localization.launch.xml's
# odom_tf (localization:=pf|cartographer) -- see low_level.launch.xml.
ekf_localization:
  ros__parameters:

    frequency     : 100.0
    sensor_timeout: 0.1
    two_d_mode    : true
    publish_tf    : true  # this node owns map->odom (cartographer_node does not, see above)

    map_frame      : map
    odom_frame     : odom
    base_link_frame: base_link
    world_frame    : map        # absolute pose in map frame

    # VESC wheel odometry: use twist only (vx, vyaw)
    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # Cartographer tracked pose (converted PoseStamped → Odometry): use position + yaw
    odom1: /tracked_pose/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
