# robot_localization EKF for pf localization, fusing the particle filter with
# wheel odometry. Produces /car_state/odom and owns the map TF.
#
# TF chain is the standard REP-105 split, and it has to be: robot_localization
# refuses map_frame/odom_frame/base_link_frame being non-distinct
# ("Invalid frame configuration!"). It doesn't actually exit on that -- it logs
# and carries on -- but the resulting config is undefined, not just cosmetically
# wrong: confirmed by running ekf_node directly against odom_frame collapsed
# onto base_link_frame (what this file used to have), which reproduces that
# error every time.
#
#   map  -> odom       this node (publish_tf below)
#   odom -> base_link   vesc_to_odom, dead reckoning between corrections
#
# vesc_to_odom's publish_tf has to be TRUE for that second hop to exist.
# localization.launch.xml's odom_tf turns it on for localization:=pf|cartographer
# and leaves it false for sim/mapping/kiss, where either nothing needs it or
# something else owns map -> base_link outright (cartographer while mapping,
# kiss_icp_localization while localising) -- see low_level.launch.xml.
ekf_localization:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true          # this node owns map->odom; pf.yaml's publish_tf stays false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_link
    world_frame:     map       # absolute pose in map frame

    # VESC wheel odometry: use twist only (vx, vyaw)
    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # Particle filter pose: use position + yaw
    odom1: /pf/pose/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
