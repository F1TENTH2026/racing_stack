# robot_localization EKF for pf localization, fusing the particle filter with
# wheel odometry. Produces /car_state/odom and owns the map TF.
#
# TF chain is the standard REP-105 split, and it has to be: robot_localization
# refuses map_frame/odom_frame/base_link_frame being non-distinct
# ("Invalid frame configuration!"). It doesn't actually exit on that -- it logs
# and carries on -- but the resulting config is undefined, not just cosmetically
# wrong: confirmed by running ekf_node directly against odom_frame collapsed
# onto base_link_frame (what this file used to have), which reproduces that
# error every time.
#
#   map  -> odom       this node (publish_tf below)
#   odom -> base_link   vesc_to_odom, dead reckoning between corrections
#
# vesc_to_odom's publish_tf has to be TRUE for that second hop to exist.
# localization.launch.xml's odom_tf turns it on for localization:=pf|cartographer
# and leaves it false for sim/mapping/kiss, where either nothing needs it or
# something else owns map -> base_link outright (cartographer while mapping,
# kiss_icp_localization while localising) -- see low_level.launch.xml.
# WHY THE YAW RATE COMES FROM THE GYRO, NOT /vesc/odom
#
# vesc_to_odom does NOT measure angular velocity. It takes the servo COMMAND,
# inverts it through steering_angle_to_servo_gain/offset, and pushes it through
# a bicycle model (vesc_to_odom.cpp: v*tan(delta)/L) -- i.e. the yaw rate the
# car WOULD have if the tyres never slipped and the servo tracked instantly.
#
# Measured against the VESC gyro over a 36 s drive (yaw_diag bag):
#   * the model came out 18.5% LOW on yaw rate (VESC = 0.815 x gyro), and
#   * the servo response lags the command by ~120 ms (peak cross-correlation).
# Over that run the car actually turned 723 deg while /vesc/odom reported 595 --
# a 128 deg heading error in half a minute. That is a systematic error, not
# noise, so the filter integrates it every cycle and map->odom has to grow to
# cancel it, which is what sends the odom frame off the map.
#
# THAT MODEL NO LONGER RUNS. vesc_to_odom now takes its yaw rate from the gyro
# directly (CAR/vehicle_config.yaml's imu_topic, vesc_to_odom.cpp's imuCallback),
# so odom -> base_link is no longer built on the servo command. Fixing it only
# here was never enough: this file governs what the EKF believes, while
# vesc_to_odom owns the odom -> base_link TRANSFORM, and that transform is what
# carries the car between corrections. A biased yaw there forced map -> odom to
# grow without bound to cancel it -- the odom frame sliding off the map.
#
# odom0 still contributes vx only, and vyaw stays off deliberately: /vesc/odom's
# yaw rate is now the SAME gyro sample that imu0 already fuses below, and
# feeding one measurement in twice makes the filter overconfident in it.
ekf_localization:
  ros__parameters:
    # Match the fastest input, do not exceed it. /vesc/odom arrives at 50 Hz
    # (vesc_driver's 20 ms state timer, vesc_driver.cpp:109); at 100 half the
    # iterations predicted forward with nothing new to correct against, and
    # this node was already missing its deadline on the Jetson.
    frequency     : 50.0
    sensor_timeout: 0.1

    # Apply an absolute pose at the time it BELONGS to, not the time it arrives.
    #
    # /pf/pose/odom is stamped with the SCAN it was computed from
    # (particle_filter.py publish_tf) and reaches this node one full MCL
    # update later -- the delay the filter prints as `possible`.
    #
    # Without these two robot_localization has no state history to rewind into,
    # so it corrects the CURRENT state with a pose the car held ~40 ms ago -- at
    # 5 m/s that is 22 cm behind. The velocity prediction pushes forward, the
    # stale correction pulls back, and base_link oscillates on the map while the
    # pose source itself is tight and correct on the car. The amplitude is
    # latency times speed.
    #
    # history_length only has to cover the worst latency; 0.2 s is eight times
    # the scan period and still only ten filter steps to replay.
    smooth_lagged_data: true
    history_length    : 0.2
    # NOTE: no <sensor>_nodelay here. That was ROS 1's TCP_NODELAY on the
    # subscriber; robot_localization's ROS 2 port never declares it (verified
    # with `ros2 param list` against this file -- queue_size shows up, nodelay
    # does not), so it is dead config wherever it still appears. queue_size is
    # real and is what matters with smooth_lagged_data: the filter needs the
    # samples still buffered when it rewinds.
    two_d_mode: true
    publish_tf: true          # this node owns map->odom; pf.yaml's publish_tf stays false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_link
    world_frame:     map       # absolute pose in map frame

    # VESC wheel odometry: use twist only (vx, vyaw)
    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,     # vx: motor ERPM, a real measurement
                   false, false, false,     # vyaw DROPPED -> see imu0 below
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 5
    # Mahalanobis gate [sigmas] on this twist. Only meaningful now that
    # /vesc/odom carries a real covariance (CAR/vehicle_config.yaml's
    # vx_variance): the filter compares the innovation against sqrt(HPH' + R)
    # and drops the sample past 5 sigma, so a wheelspin transient cannot snap
    # the speed estimate. Rejection widens P, which widens the gate, so a
    # genuinely changed speed is still accepted a few cycles later.
    odom0_twist_rejection_threshold: 5.0

    # Gyro yaw rate -- the yaw source odom0 no longer provides.
    #
    # Bias-corrected upstream by imu_bias_corrector (bias lives in
    # CAR/vehicle_config.yaml under imu_bias_corrector.gyro_bias); the launch
    # file that loads this config starts that node. Subscribing to the RAW
    # /vesc/sensors/imu here would re-introduce the zero-rate offset.
    #
    # orientation is deliberately NOT fused: that field carries the VESC's own
    # AHRS quaternion, which free-runs and drifts. Absolute heading comes from
    # odom1 (the map-locked pose); the IMU only supplies the rate.
    imu0: /vesc/sensors/imu_corrected
    imu0_config: [false, false, false,
                  false, false, false,      # no orientation (AHRS drifts)
                  false, false, false,
                  false, false, true,       # vyaw only
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10
    # Mahalanobis gate [sigmas] on the gyro -- the answer to "what if the IMU
    # spikes". Scaled by imu_bias_corrector's gyro_variance, so that value has
    # to be honest for this to bite. NOTE the same gate is deliberately NOT set
    # on odom1: a particle-filter pose JUMP is legitimate (relocalisation is
    # supposed to teleport the estimate), and gating it would leave the filter
    # stuck on a pose the PF has already abandoned.
    imu0_twist_rejection_threshold: 5.0
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # Particle filter pose: use position + yaw
    odom1: /pf/pose/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 5
