# Static-obstacle avoidance planner (spliner/static_avoidance_node.py).
#
# Loaded by race.launch.xml. Everything here is live-tunable except rate_hz,
# which is read once because a rclpy timer cannot be retimed:
#
#   ros2 param set /static_avoidance_planner evasion_distance 0.32
#
# NOTE: this planner and the state machine judge the SAME path with the same
# arithmetic, so these numbers must stay consistent with
# state_machine/config/planners/static_avoidance_planner.yaml,
# state_machine/config/planners/global_tracking.yaml and
# stack_master/config/state_machine_params.yaml:
#
#   min_free_dist_m       >= static_avoidance_planner.lateral_width_m  (0.09)
#   0.295 <= raceline_clearance_m <= evasion_distance
#   min_path_end_m        >= static_avoidance_planner.max_horizon      (10.0)
#                             ... and mind the short-track caveat on min_path_end_m
#   ego_width_m           == state_machine_params.yaml gb_ego_width_m  (0.29)
#   trajectory_threshold  >= 0.295 + largest_obstacle_size/2           (0.6 vs 0.565)
#
# Break the first and this planner publishes paths the state machine refuses --
# logfile/state_machine_20260822_173630.log has 24 PATH_BLOCKED samples on paths
# this planner had just accepted, because the two thresholds sat 5 mm apart
# (0.160 vs 0.155) while the obstacle's measured `size` swung 0.34 m frame to
# frame (obs id 8: 0.16 -> 0.50 m).
# Break the second's LOWER bound and the state machine asks for an avoidance this
# planner thinks is unnecessary, and the car trails the obstacle forever; break
# its UPPER bound and the relaxation ladder can put the apex CLOSER to the
# raceline than the obstacle's near edge already was -- an "avoidance" that
# steers towards the obstacle. Break the third and any second static obstacle
# beyond the path's end reads as blocking.
#
# ===== THE LATERAL BUDGET (2026-08-22) ==================================
# Every rejection logged as reason=track_too_narrow is this one inequality
# failing, over the whole corridor the path drives through:
#
#   gb_d_left (or gb_d_right)  >=  obstacle_near_edge + evasion + boundary_margin
#
# `evasion` is what the relaxation ladder ACTUALLY used, which is not
# evasion_distance -- static_avoidance_node.py RELAXATION_LADDER computes
# max(scale * evasion_distance, min_evasion_m), and
#
#   min_evasion_m = ego_width_m/2 + max(min_free_dist_m, 0.025)
#                 = 0.145 + 0.130 = 0.275      <-- the hard floor, no rung goes under
#   rung 0/1 (scale 1.0) : max(0.350, 0.275) = 0.350
#   rung 2/3 (scale 0.7 / 0.0) : max(0.245, 0.275) = 0.275
#
# so the corridor needed beyond the obstacle's edge is 0.350 + 0.240 = 0.590 m
# at rung 0 and 0.275 + 0.240 = 0.515 m at the floor.
#
# WHERE THE MARGIN IS SPENT (2026-08-22 evening, wall-scraping fix). The budget
# has two consumers -- the obstacle (min_free_dist_m) and the wall
# (boundary_margin) -- and they trade against each other one for one. The first
# tuning pass put 0.160 on a cone whose measured `size` swings 0.34 m frame to
# frame and 0.200 on a wall that is surveyed and does not move, which left the
# car 0.055 m from the wall and scraping it. Replaying the 162 published paths
# of logfile/static_avoidance_20260822_182649.log against the real
# global_waypoints.json track bounds gives the trade explicitly (avoidance
# success rate / resulting wall gap):
#
#   min_free_dist_m ->      0.10    0.12    0.13    0.14    0.16   wall gap
#   boundary_margin 0.20   95.1%   93.2%   93.2%   92.6%   88.3%    5.5 cm
#   boundary_margin 0.22   93.2%   92.6%   90.1%   88.3%   80.9%    7.5 cm
#   boundary_margin 0.24   92.6%   88.3%   87.7%   80.9%   72.2%    9.5 cm
#   boundary_margin 0.26   88.3%   80.9%   74.7%   72.2%   66.0%   11.5 cm
#
# 0.13 / 0.24 keeps 87.7 % against the old 88.3 % -- statistically the same
# avoidance rate -- while the wall gap goes 5.5 -> 9.5 cm. Raising
# boundary_margin ALONE costs about 4 points of avoidance per centimetre
# (88.3 -> 80.9 -> 72.2 down that 0.16 column); moving the centimetre off the
# obstacle instead costs nothing measurable.
#
# CONSEQUENCE, and the reason evasion_distance went 0.30 -> 0.35: min_evasion_m
# is set by min_free_dist_m, NOT by evasion_distance. At 0.30 the floor (0.305)
# was ABOVE evasion_distance, so all four ladder rungs collapsed to 0.305 and
# relaxation did nothing at all. 0.35 is the first value that gives the ladder a
# real range (0.350 -> 0.305). Raising evasion_distance widens that range; it
# does not raise the floor. To raise the floor, raise min_free_dist_m -- and then
# raise the corridor requirement with it.
static_avoidance_planner:
  ros__parameters:

    # ===== cadence =====================================================
    # [Hz] Replanning rate. Not the knob that makes avoidance fast -- the
    # lookahead and the path cache are. The old node ran at 40 Hz and still
    # reacted late, because it had nothing to plan around until the car was
    # nearly on top of the obstacle.
    # 20 -> 10. 정지 장애물을 5 cm마다 다시 계획할 필요가 없고, 이 노드는
    # detect/tracking/이미 scan-limited인 PF와 같은 Jetson을 나눠 쓴다.
    # (업스트림 spline_node도 같은 이유로 20 -> 10)
    rate_hz: 10.0
    # [s] Throttle for the single-line [STATIC_AVOID] status log.
    log_period_s: 0.5
    # Publish planning-callback duration on /planner/avoidance/latency.
    measure: true

    # ===== what to plan around =========================================
    # [m] How far ahead a static obstacle is considered. THIS is the early
    # detection knob. The path is planned in Frenet and therefore follows the
    # raceline's curvature, so a 10 m apex is no harder to fit than a 2 m one
    # (the old cartesian 3-point spline cut every corner and was rejected at
    # range, which is why it only ever succeeded up close).
    # BOTH this and min_path_end_m are capped at a third of the lap AT RUNTIME.
    # These are lengths in metres and what they mean depends on the track: 10 m is
    # a modest look ahead on a 60 m circuit and nearly half a lap on 0814test2,
    # which measures 22.31 m. A path spanning half a lap breaks every
    # (s - cur_s) % max_s comparison in this node and in the state machine, because
    # they all wrap at max_s/2 and can no longer tell ahead from behind.
    #
    # 10.0 -> 6.0 -> 8.0. Raised to line up with the perception layer's own
    # detection range (tracking.dist_infront = 8.0 m, detect.max_viewing_distance
    # = 9.0 m in opponent_tracker_params.yaml): at 6.0 the planner was sitting on
    # an already-detected obstacle for ~2 m before it started building a path
    # around it. state_machine/config/planners/static_avoidance_planner.yaml's
    # max_horizon was raised 7.0 -> 8.0 in lockstep -- otherwise the state machine
    # keeps judging the raceline "free" past the old 7 m and OVERTAKE still only
    # triggers once the obstacle closes inside that, defeating this change.
    # CAVEAT: on tracks under ~24 m (track/3 < 8.0, e.g. 0814test1/2, 0815test1,
    # 0810test1, 0805test1, 0804test*) the _TRACK_FRACTION cap below still keeps
    # this planner's own published path shorter than 8.0 m -- but max_horizon in
    # the state_machine yaml is NOT auto-capped the same way, so on those short
    # maps re-check that invariant (see that file's comment) before racing on them.
    lookahead: 8.0

    # [m] Keep planning for an obstacle up to this far BEHIND the car. Dropping
    # it the instant its s went past ended the manoeuvre before the return leg
    # had been driven, and snapped the car back onto the raceline alongside the
    # obstacle.
    keep_behind_m: 1.0

    # [m] Ignore obstacles further than this from the raceline: they are not on
    # the line and nothing needs to be planned around them.
    trajectory_threshold: 0.6

    # [m] If the obstacle's near edge is already at least this far from the
    # raceline, the line clears it and this planner publishes nothing.
    #
    # LOWER BOUND -- must be >= what the state machine calls a blocked raceline,
    # gb_ego_width_m/2 + global_tracking.lateral_width_m = 0.145 + 0.15 = 0.295,
    # or the state machine wants an avoidance this planner refuses to build and
    # the car trails the obstacle forever.
    #
    # UPPER BOUND -- must be <= evasion_distance. Above that, an obstacle whose
    # near edge sits between evasion and this value is still treated as a blocker
    # while the apex (near_edge_side +/- evasion) lands INSIDE the raceline's own
    # clearance: the "avoidance" steers towards the obstacle instead of away.
    #
    # 0.30 -> 0.35, in lockstep with evasion_distance so the pair stays at the top
    # of that window. Note rungs 2/3 of the ladder plan at min_evasion_m (0.305),
    # so an obstacle with near_edge in (0.305, 0.35) can still produce a
    # near-degenerate apex on those rungs -- harmless (it still clears
    # min_free_dist_m, and the state machine still accepts it), but it is why this
    # value should not be pushed further above evasion_distance.
    raceline_clearance_m: 0.35

    # Maximum number of simultaneously visible static obstacles shaped into one
    # same-side path. The simulator supports at most three practice obstacles.
    # All visible candidates inside `lookahead` are considered; the path returns
    # to the raceline only after the final member of this group.
    max_group_obstacles: 3

    # ===== path shape ==================================================
    # [m] Clearance from the obstacle's EDGE to the path (the car's centreline).
    # Real gap to the car's SIDE is this minus ego_width_m/2 = 0.350 - 0.145
    # = 0.205 m at the preferred rung.
    #
    # This is the PREFERRED clearance, not the guaranteed one. The relaxation
    # ladder in static_avoidance_node.py plans at
    #     max(scale * evasion_distance, min_evasion_m)
    # with scale = 1.0, 1.0, 0.7, 0.0 over the four rungs, and
    #     min_evasion_m = ego_width_m/2 + max(min_free_dist_m, 0.025) = 0.305
    # so the ladder actually walks 0.350 -> 0.350 -> 0.305 -> 0.305.
    #
    # 0.30 -> 0.35. At 0.30 the value was BELOW its own floor (0.305), so all four
    # rungs came out identical and relaxation was a no-op -- only the side and the
    # return distance ever changed. logfile/static_avoidance_20260822_173631.log:
    # 32x track_too_narrow on obstacle id 8, with 0.540 m of corridor beyond the
    # obstacle edge against the 0.545 m the single collapsed rung demanded. Five
    # millimetres. With 0.35 (and boundary_margin at 0.20) rung 0 asks 0.550 and
    # is still refused there, but rung 2 asks 0.505 and gets through -- which is
    # the whole point of having a ladder.
    #
    # Raising this does NOT make the car pass wider in a tight gap; it only makes
    # it pass wider where there is room, and gives relaxation somewhere to fall
    # back to. See the LATERAL BUDGET block at the top of this file.
    evasion_distance: 0.35

    # [m] Spacing of the published path. The state machine walks every point of
    # it at 80 Hz, so this is a CPU knob as much as a fidelity one.
    spline_resolution: 0.10

    # [m] Length of the lateral transition BEFORE the apex. THIS is the knob that
    # decides when the steering actually starts -- lookahead only decides when the
    # planner starts thinking. Now
    #   clip(min(room to the apex, gain * speed), min, max)
    # scaled by the raceline curvature over the span (_approach_dist /
    # _corner_scale in static_avoidance_node.py), instead of clip(gain*speed,..).
    #
    # Why the ceiling moved 4.0 -> 8.0: the offset is about 0.55 m, so
    # kappa = 6*dd/L^2 is 0.206 rad/m over 4 m and 0.052 rad/m over 8 m. The state
    # machine's static_avoidance_cb -> update_velocity puts that kappa through the
    # ggv (ay_max 4.5 m/s^2), which caps the avoidance at 4.67 m/s in the first
    # case and does not constrain it at all in the second. Curvature is the only
    # lever on speed during an avoidance, and length is the only lever on
    # curvature.
    # gain 1.0 -> 1.6 so the speed term can actually reach the new ceiling at
    # racing speed (1.6 * 5 m/s = 8 m); below ~2.5 m/s the min floor governs.
    # 8 m is also about the practical limit on 0815test3: its straights measure
    # ~10 m and ~8.6 m, and d_right narrows to 0.51 m, so a longer span would meet
    # boundary_margin and be rejected by _clamp_to_track.
    pre_dist_gain: 1.6
    pre_dist_min: 2.0
    pre_dist_max: 8.0

    # The flat hold in front of the car is whatever the speed term leaves of the
    # room (see _build_path): 10 m of room and 8 m of transition means the car
    # holds its current offset for 2 m and then moves over. When the obstacle is
    # nearer than the speed term wants there is no hold and the move starts at the
    # car, exactly as the old code did in every case.

    # [rad/m] Raceline curvature above which the line counts as "in a corner"
    # (_corner_exit_limit). 0 disables the correction. The approach is walked back
    # from the apex and cut at the exit of the last corner it reaches into, so the
    # lateral move starts once the car is OUT of the corner rather than while it
    # is still using the track width to get around it.
    # On 0815test3 (|kappa| median 0.166, p75 0.317, max 0.754 rad/m) 0.30 picks
    # out exactly the two real straights: obstacles with their apex at s 6.2-10.2
    # or s 24.1-28.5 get the full 8 m approach, the rest fall back to the floor
    # below. Retune per map -- it is an absolute curvature, not a fraction.
    pre_dist_kappa_max: 0.30

    # [m] Floor under the corner cut above -- NOT under the room limit. It is set
    # to the OLD pre_dist_max on purpose: an obstacle sitting in a corner is now
    # approached over exactly the distance it was before, so this whole change can
    # only lengthen an approach, never shorten one. Raising it weakens the corner
    # rule; setting it equal to pre_dist_max disables the rule entirely.
    pre_dist_corner_min_m: 4.0

    # [m] Length of the return leg AFTER the apex, same form. There is time to
    # move over before the obstacle and none to spare after it, so the two
    # sides are deliberately not symmetric.
    post_dist_gain: 0.8
    post_dist_min: 1.5 # 복귀 진입 거리 최소값
    post_dist_max: 4.0

    # [m] Global-line tail appended after the return, so the state machine can
    # measure obstacles past the manoeuvre.
    tail_m: 4.0

    # [m] Minimum distance from the car to the end of the published path. The
    # state machine treats a static obstacle beyond the path's end as blocking
    # (the static/beyond_path branch of _check_free_frenet), so the path has to
    # reach at least as far as its max_horizon.
    #
    # 11.0 -> 8.0 -> 10.0, raised with lookahead: an 8 m approach plus the return
    # leg reaches further than 8 m, and the state machine must be able to measure
    # that far or it calls the far end "beyond path". Only lengthens the
    # global-line tail (end_u = max(sample_u[-1] + tail_m, cur_s + _path_end_eff)),
    # so it cannot cause a rejection. Capped at a third of the lap at runtime
    # (11.54 m on 0815test3, so 10.0 stands there).
    #
    # ** SHORT-TRACK CAVEAT ** state_machine/config/planners/
    # static_avoidance_planner.yaml's max_horizon was raised 7.0 -> 10.0 to match,
    # and THAT value is not capped at track/3 at runtime the way this one is. On
    # 0815test3 (34.62 m) and 'f' (77.65 m) they agree at 10.0. On the sub-30 m
    # maps here -- 0804test 17.79, 0804testt2 20.49, 0814test1 20.60, 0814test2
    # 22.31, 0815test1 22.48, 0805test1 22.75, 0810test1 22.84 -- this one is
    # capped to 5.93-7.61 m while max_horizon stays 10.0, breaking the invariant
    # and reintroducing "stuck in TRAILING on a static obstacle beyond path end".
    # Lower max_horizon to track_length/3 before racing on any of those.
    min_path_end_m: 10.0

    # [m] Once the car is alongside the obstacle the apex is pushed this far
    # ahead rather than the path being dropped -- an empty path here makes the
    # state machine leave OVERTAKE mid-manoeuvre.
    min_apex_lead_m: 0.5

    # ===== safety ======================================================
    # [m] How close the path's CENTRELINE may come to the track edge. The number
    # that matters is this minus the car's half width: 0.24 - 0.145 = 9.5 cm of
    # air between the bodywork and the wall, which is what localisation error
    # plus pure-pursuit tracking error is worth on this car.
    #
    # 0.24 -> 0.20 -> 0.24. Dropped to 0.20 to make avoidance work at all, and
    # that worked -- but 0.20 leaves only 5.5 cm and the car started scraping the
    # wall. THE SCRAPE IS NOT NEXT TO THE OBSTACLE. _clamp_to_track is applied
    # per sample against the LOCAL gb_d, while the obstacle clearance is only
    # re-checked at the obstacle's own s, so a path can be accepted on a
    # comfortable gap at the obstacle and still be pinned flat against the wall
    # somewhere else in its span. logfile/static_avoidance_20260822_182649.log:
    # of 165 published paths the chosen side's clearance was under
    # boundary_margin on 86 of them (52 %) -- i.e. every one of those held
    # centreline exactly boundary_margin from the edge through the narrow part of
    # the approach or return. The narrow parts on 0822test are s=24-26 and
    # s=28-30 m, where d_left bottoms out at 0.474 m against a 0.868 m median.
    # At the obstacle itself the median wall gap was a comfortable 26 cm.
    #
    # Raising this alone is expensive (~4 points of avoidance success per cm), so
    # it was paid for out of min_free_dist_m instead -- see the WHERE THE MARGIN
    # IS SPENT table at the top of this file.
    #
    # Must stay ABOVE the map filter's effective erosion (see kernel_size below,
    # ~0.10-0.15 m at kernel_size 4) so the Frenet check remains the binding wall
    # constraint and the map filter stays the secondary catch it is meant to be.
    boundary_margin: 0.24

    # [m] The car's width. Must match the state machine's gb_ego_width_m (0.29)
    # or the two disagree about what clears an obstacle.
    ego_width_m: 0.29

    # [m] Free gap required between the car's side and the obstacle's edge, on
    # the finished path. Must stay >= the state machine's
    # static_avoidance_planner.lateral_width_m (0.09) so a path this planner
    # accepts is one the state machine accepts.
    #
    # THIS IS ALSO THE FLOOR ON evasion_distance. min_evasion_m in
    # static_avoidance_node.py is ego_width_m/2 + max(this, 0.025) = 0.275, and no
    # relaxation rung plans closer than that. Raise this and you raise the
    # corridor width the planner needs everywhere -- 0.16 -> 0.20 would push the
    # floor to 0.345, back above evasion_distance, collapsing the ladder exactly
    # as the 0.30 evasion_distance did.
    #
    # 0.16 -> 0.13, to buy the 4 cm of wall clearance under boundary_margin above.
    # This only binds where the track is genuinely tight: in a wide section rung 0
    # still plans at evasion_distance (0.35, i.e. 0.205 m of bodywork-to-cone
    # air), and this floor is only reached once the clamp has already pulled the
    # path in. So the car passes 13 cm from a cone in a pinch instead of 16 cm,
    # and that 3 cm is far inside the measurement noise on the cone anyway --
    # the wall it was traded for is surveyed and does not move.
    #
    # The agreement margin against the state machine is what was actually wrong:
    # logfile/state_machine_20260815_155720.log shows the same tracked obstacle's
    # `size` swinging ~13 cm frame to frame (obs id 17: 0.38->0.25 m), and
    # logfile/state_machine_20260822_173630.log shows 0.34 m of swing (obs id 8:
    # 0.16->0.50 m). That feeds straight into d_left/d_right (detect.cpp:
    # d_left = d_center + size/2), into this check, and into the state machine's
    # own re-check on a DIFFERENT frame's snapshot. 0.160 here against 0.155 there
    # left 5 mm of tolerance for a +-0.17 m measurement -- hence the state machine
    # lateral_width_m, held 0.04 m below this value (now 0.09).
    min_free_dist_m: 0.13

    # [m] Path length from the car over which the boundary check is relaxed to
    # the car's own current offset. Where the car IS is a fact no path can
    # undo; refusing every candidate because its first few centimetres start
    # where the car already stands leaves nothing to publish.
    ego_grace_m: 1.0

    # Secondary check of the generated manoeuvre against the eroded map image.
    # Skipped (with the path still boundary- and clearance-checked) when no map
    # has arrived -- GridFilter.is_point_inside returns False for every point
    # until then, which silently rejected everything.
    use_map_filter: true
    # [px] cv2.erode structuring-element WIDTH, not an erosion radius. At
    # 0.05 m/px a 4x4 rect eats 2-3 px off the free space, i.e. ~0.10-0.15 m --
    # NOT the 0.20 m an earlier version of this comment claimed. That is roughly
    # the car's half width (0.145) and deliberately LESS strict than
    # boundary_margin (0.20), so the Frenet check stays the binding wall
    # constraint and this only catches map features the raceline bounds do not
    # describe. 8 px double-counted and rejected valid paths on narrow sections.
    #
    # The 12x reason=map_occupied in logfile/static_avoidance_20260822_173631.log
    # are therefore NOT this filter being over-tight: they are the map saying
    # there is less room than gb_d_left claims at that spot, by more than 10 cm.
    # That is a global-trajectory/map disagreement to fix in the raceline bounds,
    # not something to tune away here -- lowering this would only let the car
    # drive at a wall the map can see.
    kernel_size: 4

    # [m/s] Speed seed written onto the avoidance waypoints, capped. The state
    # machine replans the profile from the path's curvature and the ggv
    # (update_velocity), so this only matters if that replanning is unavailable.
    max_speed_mps: 2.0

    # ===== stability ===================================================
    # [s] How long the last valid path survives a planning frame that failed.
    # On a failure inside this window the held path is republished WITH ITS
    # ORIGINAL STAMP -- it is not claimed to be fresh, and the state machine's
    # own latest_threshold (0.25 s) still decides usability. This only stops a
    # single dropped frame being published as a positive assertion that there
    # is nothing to avoid, which dropped the car out of OVERTAKE mid-manoeuvre.
    # Capped at the state machine's latest_threshold: holding longer only
    # republishes paths it will reject as stale.
    #
    # The held path is discarded immediately, before the window expires, if the
    # obstacle disappears, a different obstacle becomes the target, the car
    # drives off the path's end, or the path has become a collision.
    path_hold_s: 0.25

    # [m] How much wider the other side must be before the planner switches
    # sides. Left and right room are often within a couple of centimetres of
    # each other and the obstacle's measured edges move by about that much
    # between frames, so a bare comparison flips sides several times a second --
    # and every flip is a completely different path, which the state machine
    # then rejects because the car is not on it.
    side_hysteresis_m: 0.10
