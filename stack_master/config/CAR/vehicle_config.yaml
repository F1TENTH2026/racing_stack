/**:
  ros__parameters:
    # wheelbase: 0.33            # 이전 값 (롤백용으로 주석 보존)
    wheelbase: 0.324
    scan_topic: 'scan'
    odometry_topic: 'vesc/odom'

urg_node:
  ros__parameters:
    # One range for every consumer (mapping/cartographer, pf, detect): pf and
    # detect both read msg.angle_min/angle_max off /scan directly (no separate
    # FOV param of their own, though detect also self-narrows via its own
    # max_angle_rad in opponent_tracker_params.yaml, which is now a no-op at
    # this value), and cartographer_node has no angle filter at all, so
    # whatever is set here is what mapping sees too. Was widened to +-3.14 for
    # pf's relocalization FOV, but that let raw /scan reach cartographer
    # unfiltered during mapping and caught chassis/mount self-hits at the wide
    # edges, degrading scan matching -- back to the single +-1.8 rad range
    # that mapping, detect, and pf all use uniformly.
    angle_max: 1.8
    angle_min: -1.8
    ip_address: "192.168.0.10"
    ip_port: 10940
    laser_frame_id: "laser"
    calibrate_time: false
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    publish_intensity: true
    publish_multiecho: false
    cluster: 1
    skip: 0

vesc/**:
  ros__parameters:
    port: "/dev/ttyACM0"
    publish_tf: false
    # /vesc/commands/motor/brake is a positive motor-phase current command.
    # Keep an independent driver-side hard limit even if the bridge is retuned.
    brake_max: 30.0
    brake_min: 0.0
    current_max: 100.0
    current_min: 0.0
    duty_cycle_max: 0.0
    duty_cycle_min: 0.0
    position_max: 0.0
    position_min: 0.0
    servo_max: 1.0
    servo_min: 0.0
    speed_max: 23250.0
    speed_min: -23250.0
    speed_to_erpm_gain: 4614.0 #4577.5 # 초기값 4614.0 켈리브 후 수정
    speed_to_erpm_offset: 0.0
    brake_control_enabled: true
    brake_current_max: 30.0         # 이전 값 10.0 (kHardBrakeCurrentLimit도 30으로 상향)
    # 제동이 풀리면 brake_current_는 0으로 리셋되므로, 매 제동은 0 A에서 다시
    # 램프를 타고 올라간다. 명령 주기가 ~50 Hz(dt≈0.02 s)라 램프 레이트가
    # 정지 시간을 지배한다: 100 A/s면 틱당 2 A로 30 A까지 0.3 s가 걸렸다.
    brake_current_start: 8.0        # 이전 값 5.0; 물리는 첫 순간의 목표 전류
    brake_current_gain: 15.0        # A per (m/s) of speed error; 이전 값 10.0
                                    # start+gain*err 이므로 오차 1.5 m/s에서 상한 포화 (이전 2.5)
    brake_current_ramp_rate: 300.0  # A/s; 이전 값 100.0. 30 A 도달 0.3 s -> 0.1 s
    brake_engage_speed_error: 0.15
    brake_release_speed_error: 0.05
    brake_release_speed: 0.15
    brake_odom_timeout: 0.2
    steering_angle_to_servo_gain: -0.99 #-1.2216 #-1.2135 좌우 반전(-) 캘리브 후 수정함.
    steering_angle_to_servo_offset: 0.4870 # 초기값 0.5304 (음수 = 오른쪽, 양수 = 왼쪽)
    use_servo_cmd_to_calc_angular_velocity: true

    # vesc_to_odom's yaw rate. Empty leaves the servo-COMMAND bicycle model in
    # charge (v*tan(delta)/L), which measured 18.5% low and ~120 ms late on
    # this car -- and vesc_to_odom owns odom->base_link, so that error went
    # straight into the odom frame and map->odom had to grow without bound to
    # cancel it. The pf (pf.yaml) and the EKFs (ekf_*.yaml) were already on the
    # gyro; this node was the last one modelling it.
    #
    # _corrected, not the raw topic: imu_bias_corrector_node (started by
    # localization.launch.xml and mapping.launch.xml) removes the measured
    # zero-rate offset above, which this node would otherwise integrate every
    # cycle. Set to '' to A/B against the old bicycle model.
    imu_topic: '/vesc/sensors/imu_corrected'
    # [s] Age past which a gyro sample is dropped and the bicycle model takes
    # back over. Matches brake_odom_timeout; the IMU runs at 100 Hz
    # (vesc_driver's 10 ms timer), so 0.2 s is 20 missed samples.
    imu_timeout: 0.2

    # /vesc/odom's TWIST COVARIANCE. Upstream published zeros, and zero does not
    # mean "unknown" downstream: robot_localization replaces a zero variance
    # with 1e-9 (ekf.cpp) purely to keep the Kalman gain finite, so the EKF was
    # treating raw ERPM speed as exact.
    #
    # PROVISIONAL -- these are conservative starting points, not measurements.
    # No stationary IMU bag survived the 2026-08-20 calibration (the script
    # printed the std and nothing wrote it down), so:
    #   vx_variance             sigma 0.1 m/s. Covers the ~0.8% speed_to_erpm_gain
    #                           calibration spread and some wheelspin; slip under
    #                           hard acceleration is worse than this.
    #   yaw_rate_variance_gyro  sigma 0.02 rad/s, matching imu_bias_corrector's
    #                           gyro_variance below. Keep the two in step.
    #   yaw_rate_variance_model sigma 0.5 rad/s. The fallback bicycle model ran
    #                           18.5% low, which is ~0.37 rad/s of error at a
    #                           2 rad/s hairpin -- it should be down-weighted
    #                           hard, not silently trusted like the gyro.
    vx_variance: 1.0e-2
    yaw_rate_variance_gyro: 4.0e-4
    yaw_rate_variance_model: 2.5e-1

imu_bias_corrector:
  ros__parameters:
    gyro_bias: [-0.0013704, 0.0005222, 0.0003731] #[-0.0028153, -0.0018412, 0.0040946] imu calibration 후 수정 # rad/s, measured stationary
    # [(rad/s)^2] per axis, AFTER the bias above is removed. Only z is fused.
    #
    # PROVISIONAL: sigma 0.02 rad/s -- but not an arbitrary one. There is
    # nothing to copy from roboracer_unita_ws: its vesc_driver publishes no
    # covariance either, its vesc_to_odom sets pose covariance only (twist is
    # still the upstream @todo), and the one process_noise_covariance matrix it
    # does carry sits in config/common/ekf.yaml, which its own header marks
    # UNUSED and which is byte-for-byte robot_localization's built-in default
    # (filter_base.cpp:110-124). Measurement covariance cannot come from yaml at
    # all -- robot_localization reads R off the message, there is no
    # odom0_covariance parameter -- which is why this lives here.
    #
    # The floor comes from our own data: the two stationary calibrations of
    # gyro_bias above disagree by 0.0037 rad/s on z (+0.0040946 -> +0.0003731),
    # so run-to-run uncertainty after bias removal is at least that. 0.02 rad/s
    # is ~5x that floor, leaving room for the vibration a still car never sees.
    #
    # imu_gyro_bias_check.py already computes the
    # real number -- rerun it (car still, 10 s) and paste the gyro_variance line
    # it now prints. Measure with the motor idling if you can: a dead-still car
    # understates the vibration the gyro actually sees while racing, and this
    # value is what scales ekf_*.yaml's imu0_twist_rejection_threshold.
    gyro_variance: [4.0e-4, 4.0e-4, 4.0e-4]
    # [(m/s^2)^2] Nothing fuses accel today; declared for honesty.
    accel_variance: [9.0e-2, 9.0e-2, 9.0e-2]
