# Smooth local dead reckoning.  This is the only publisher of odom->base_link.
# VESC contributes measured ERPM-derived longitudinal speed only; angular.z in
# /vesc/odom is deliberately excluded because it is computed from servo command.
ekf_local_odom:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 1

    # Gyro angular velocity only. Quaternion orientation is intentionally off;
    # absolute yaw correction belongs to PF/cartographer in the global EKF.
    imu0: /vesc/sensors/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 1
