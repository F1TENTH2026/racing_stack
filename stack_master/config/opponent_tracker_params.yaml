detect:
  ros__parameters:
    rate_detect: 40
    min_size_n: 4
    # Obstacle is a 0.30 x 0.30 m box. min_size_m is now a real rejection floor (half the
    # box, so a partly occluded face still passes); max_size_m is the ceiling with room for
    # a corner view plus fit noise.
    min_size_m: 0.15
    max_size_m: 0.45
    lambda_deg: 10
    sigma: 0.029999999999999999
    min_2_points_dist: 0.01
    new_cluster_threshold_m: 0.40000000000000002
    max_viewing_distance: 9
    # Detection cone half-width [rad], independent of the lidar's own
    # angle_min/angle_max (CAR/vehicle_config.yaml's urg_node block, now the
    # sensor's full +-3.14 for localization's benefit). Kept at the FOV
    # detect used to get from the driver so obstacle detection is unchanged.
    max_angle_rad: 1.8
    # How far inside the track edge an obstacle centre must sit to be accepted [m].
    # A 0.30 m box physically cannot have its centre closer than 0.15 m to a wall, so
    # 0.25 rejects wall returns while still accepting a real obstacle placed near the edge.
    boundaries_inflation: 0.25
    filter_kernel_size: 7
    measure: false
    from_bag: false
    save_params: false
tracking:
  ros__parameters:
    save_params: false
    rate_tracking: 40
    P_vs: 0.2
    P_d: 0.02
    P_vd: 0.2
    measurment_var_s: 0.002
    measurment_var_d: 0.002
    measurment_var_vs: 0.2
    measurment_var_vd: 0.2
    process_var_vs: 2.0
    process_var_vd: 8.0
    max_dist: 0.5
    var_pub: 1.0
    aggro_multi: 2.0
    dist_deletion: 7.0
    dist_infront: 8.0
    max_std: 0.2
    min_std: 0.16
    min_nb_meas: 3
    noMemoryMode: true
    debug_mode: false
    publish_static: true
    ratio_to_glob_path: 0.6
    ttl_dynamic: 40
    ttl_static: 12
    vs_reset: 0.1
    measure: false
    from_bag: false
