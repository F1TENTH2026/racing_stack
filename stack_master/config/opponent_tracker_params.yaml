detect:
  ros__parameters:
    # [Hz] 40 -> 20. 업스트림(roboracer_unita_ws)이 같은 Jetson에서 측정해
    # 내린 값이고, 그 이유가 우리가 겪은 증상 그대로다: 40에서는 "the jetson
    # saturated, and /tf reached the detector a full second late, which put
    # every obstacle a metre or two behind where it really was".
    #
    # 20 Hz는 갱신 간격 50 ms. 정지 장애물을 3 m/s로 접근하면 15 cm이므로
    # 올릴 이유가 없다. 올리기 전에 반드시 측정할 것:
    #   ros2 param set /detect measure true && ros2 topic echo /detect/latency
    # tick 주기(50 ms)에 근접하면 타이머가 못 따라가는 것이다.
    rate_detect: 20
    min_size_n: 4
    # Obstacle is a 0.30 x 0.30 m box. min_size_m is now a real rejection floor (half the
    # box, so a partly occluded face still passes); max_size_m is the ceiling with room for
    # a corner view plus fit noise.
    min_size_m: 0.15
    max_size_m: 0.60 # 테스트 기존 0.45 > 0.60
    lambda_deg: 10
    sigma: 0.029999999999999999
    min_2_points_dist: 0.01
    new_cluster_threshold_m: 0.20 # 테스트 기존 0.40000000000000002 > 0.20
    max_viewing_distance: 9
    # Detection cone half-width [rad], independent of the lidar's own
    # angle_min/angle_max (CAR/vehicle_config.yaml's urg_node block, now the
    # sensor's full +-3.14 for localization's benefit). Kept at the FOV
    # detect used to get from the driver so obstacle detection is unchanged.
    max_angle_rad: 1.8
    # How far inside the track edge an obstacle centre must sit to be accepted [m].
    # A 0.30 m box physically cannot have its centre closer than 0.15 m to a wall, so
    # 0.25 rejects wall returns while still accepting a real obstacle placed near the edge.
    boundaries_inflation: 0.15 # 테스트 기존 0.25 > 0.15
    filter_kernel_size: 7
    measure: false
    from_bag: false
    save_params: false
tracking:
  ros__parameters:
    save_params: false
    # [Hz] rate_detect와 짝. 트래커는 detect의 출력을 소비하므로 그보다
    # 빠르게 돌 이유가 없다 -- 같은 측정을 두 번 처리할 뿐이다.
    # 아래 min_nb_meas / 프레임 허용치가 전부 이 값 기준의 "프레임 수"라,
    # 바꾸면 그 초 환산값이 2배로 늘어난다는 점에 주의 (40프레임 = 2.0 s).
    rate_tracking: 20
    P_vs: 0.2
    P_d: 0.02
    P_vd: 0.2
    measurment_var_s: 0.002
    measurment_var_d: 0.002
    measurment_var_vs: 0.2
    measurment_var_vd: 0.2
    process_var_vs: 2.0
    process_var_vd: 8.0
    max_dist: 0.5
    var_pub: 1.0
    # 2.0 -> 1.3: association radius while an obstacle is flagged dynamic is
    # max_dist * aggro_multi (verify_position()). At 2.0 a false-dynamic obstacle
    # kept sweeping up a wide radius of noisy measurements every frame, which fed
    # right back into std_s/std_d and kept it from ever recovering to static.
    aggro_multi: 1.3
    dist_deletion: 7.0
    dist_infront: 8.0
    # 0.2 -> 0.3: std_s/std_d above this hard-resets the static vote count
    # (ObstacleSD.isStatic()). Real static-obstacle jitter (LiDAR cluster-centroid
    # noise, ego localisation drift -- see the min_free_dist_m comment above about
    # size swinging ~13 cm frame to frame) was landing inside the old 0.16-0.2
    # band often enough to flip static obstacles to dynamic on race.launch (where
    # lane_change_planner actually acts on that flag, unlike quali.launch).
    max_std: 0.3
    # 0.16 -> 0.22: below this, a measurement votes static. Widened together with
    # max_std so ordinary detection noise on a genuinely static obstacle clears
    # the static-vote bar instead of sitting in the old dead zone between the two
    # thresholds (neither voting static nor hard-resetting, just diluting the
    # ratio). Still well under real opponent-motion std, so a moving car is not
    # expected to get swept into this band.
    min_std: 0.22
    # 3 -> 8: measurements required (at rate_tracking=40 Hz, min_nb_meas=3 was
    # locking in a verdict after ~75 ms -- one or two noisy frames could decide
    # it). 8 is still only ~200 ms, negligible against the ~8 m detection range,
    # but averages out enough frames that transient cluster/localisation jitter
    # doesn't singlehandedly flip the classification.
    min_nb_meas: 8
    noMemoryMode: true
    debug_mode: false
    publish_static: true
    ratio_to_glob_path: 0.6
    ttl_dynamic: 40
    # 12 -> 40 frames. With noMemoryMode: true, ttl is decremented on EVERY frame a
    # static track goes unmatched (multi_tracking.py update()), so 12 @ 40 Hz meant
    # 0.3 s of missed detections deleted the track. logfile/
    # latest_static_avoidance.log shows one obstacle at a fixed obs_s=11.4 cycling
    # through id 1 -> 4 -> 5 -> 7 -> 8 -> 9 -> 14 with
    # reason=no_static_obstacle_in_range in between: each new id costs min_nb_meas
    # frames to re-confirm as static, drops the obstacle out of /tracking/obstacles
    # meanwhile, and makes the planner's _usable_cache discard its path as
    # "different_obstacle". 40 frames = 1.0 s tolerates that without holding a
    # genuinely departed obstacle long (an obstacle that really left also leaves
    # the 8 m dist_infront window). This matters more now that the avoidance shape
    # is latched per obstacle-id group (_latch_move_start): an id change resets the
    # latch and the long approach starts over.
    ttl_static: 40
    # 0.1 -> 0.2: dynamic obstacles revert to static once avg_vs (Kalman-estimated
    # s-velocity) drops below this (StaticDynamic.update()). A static obstacle
    # that got misclassified as dynamic was estimating small nonzero vs from pure
    # measurement noise and sitting just above the old 0.1 m/s floor, so it never
    # recovered. 0.2 gives it room to revert quickly instead of staying "dynamic"
    # (and handed to lane_change_planner) indefinitely.
    vs_reset: 0.2
    measure: false
    from_bag: false
