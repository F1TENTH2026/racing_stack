state_machine:
  ros__parameters:
    # structural
    # [Hz] 80 -> 50. 매 tick마다 캐시된 경로와 모든 장애물을 python으로 다시
    # 훑는다. 실제로 조향하는 것은 50 Hz의 controller_manager이므로, 그보다
    # 빠르게 결정하는 상태기계는 직전 결정이 반영되기도 전에 다시 결정할 뿐이다.
    # 또 새 절대 포즈는 PF에서 40 Hz로만 온다 -- 80은 같은 입력을 두 번 계산.
    #
    # controller.yaml의 state_machine_rate와 반드시 짝으로 유지할 것:
    # 컨트롤러의 워치독 임계가 loop_rate/state_machine_rate*10 이라, 어긋나면
    # "Received no local wpnts. STOPPING!!" 발동 시점이 의도와 달라진다.
    #
    # 초 단위로 적힌 파생 카운터(overtaking_ttl, splini_ttl, FTG 타이머,
    # blended-recovery grace)는 전부 `초 * rate`로 계산되므로 자동으로 따라온다.
    rate: 50
    n_loc_wpnts: 80

    # [Hz] 로컬 웨이포인트 마커를 그리는 주기. 주행 동작과 무관한 순수 시각화다.
    # 구독자가 없으면 아예 안 그리고(가드), 있으면 이 주기로 제한한다.
    # 0이면 완전히 끈다. 업스트림도 10.0.
    viz_rate_hz: 10.0
    timetrials_only: false
    sim: true
    measure: false
    racecar_version: "CAR"
    ot_planner: "lane_change"
    track_length: 1.0
    # geometry / horizons
    gb_ego_width_m: 0.29 # 초기값 0.4
    gb_horizon_m: 15.0
    interest_horizon_m: 20.0
    overtaking_horizon_m: 6.9
    # [m] Gap to the closest blocking obstacle at which TRAILING caps cruise speed
    # to trailing_speed_scale * raceline speed (see _apply_trailing_speed_cap).
    # Was 0.5 as a dead/unread leftover; raised now that it's actually consumed --
    # 0.5 m left no reaction time at racing speed.
    #
    # 4.0 -> 8.0, MATCHED TO tracking.dist_infront (8.0 m).
    #
    # The tracker does not report an opponent further than dist_infront, so 8 m is
    # everything the car will ever get. At 4.0 the car held full raceline speed for
    # the first HALF of that -- it saw the opponent at 8 m and only began cutting
    # cruise speed at 4 m, by which point the distance was already spent.
    #
    # The arithmetic (brake 4 m/s^2, 120 ms command lag, gap_should = 0.25*v + 2.5):
    #
    #   ego 4 m/s  vs opponent 1.5 -> needs  5.1 m   fits in 8
    #   ego 6 m/s               -> needs  7.8 m   just fits
    #   ego 8 m/s               -> needs 11.6 m   3.6 m SHORT
    #   ego 10 m/s              -> needs 16.3 m   8.3 m SHORT
    #
    # i.e. above ~6.1 m/s closing on a slow opponent the gap CANNOT be held, the
    # car overruns gap_should, and trailing_controller's clip(..., 0, ...) floors
    # the command at zero -- a dead stop, followed by the slow pull-away the driver
    # sees. No PID gain fixes that; the distance simply is not there. Starting the
    # cap the moment the opponent becomes visible is what buys it back: braking
    # distance is quadratic in speed, so approaching at 4 m/s instead of 6 costs
    # 1.7 m instead of 4.2 m.
    #
    # 0820test1's straights run at 10.3 m/s, so this does not remove the problem
    # outright -- it moves the threshold up. Raising tracking.dist_infront toward
    # the UST-10LX's 10 m guaranteed range is the other half.
    emergency_break_horizon: 8.0
    # safety
    volt_threshold: 11.0
    # dynamic (replaces dyn_statemachine_tuner.cfg)
    lateral_width_gb_m: 0.1 # 초기값 0.3
    lateral_width_ot_m: 0.1 # 초기값 0.3
    splini_hyst_timer_sec: 0.7
    splini_ttl: 2.0
    pred_splini_ttl: 2.0
    overtaking_ttl_sec: 3.0
    overtake_min_closing_mps: 2.5
    # Cruise-speed cap while TRAILING inside emergency_break_horizon, as a fraction
    # of the raceline speed at the car's current s. NOT a full stop -- calc_vel_profile
    # still reaches it via a normal decel curve, not the maxed-out braking one.
    #
    # 0.5 -> 0.35, together with emergency_break_horizon 4 -> 8. The cap now starts
    # twice as early, so it can afford to be deeper: the point is to be BELOW the
    # ~6.1 m/s at which the gap stops being holdable by the time the opponent is
    # close. Deliberately trading approach speed for never reaching a dead stop --
    # a stop costs far more time than a slow approach, because the car has to break
    # static friction and ramp back up through the VESC's brake-release hysteresis.
    # trailing_min_speed_mps below still stops this crawling toward 0 in corners.
    trailing_speed_scale: 0.35
    # 캡을 간격에 비례해 서서히 적용할지(true), 지평을 넘는 순간 한 번에
    # 적용할지(false, 예전 동작).
    #
    # false 였을 때: 간격 8.01 m 에서는 레이스라인 전속, 7.99 m 에서는 즉시 35%.
    # 직선(10.3 m/s)에서 10.3 -> 3.6 m/s 절벽이 1 cm 간격 차이로 발생했고,
    # 노이즈가 그 경계에 걸리면 토글까지 났다. 운전석에서는 "너무 멀리서부터
    # 심하게 느려진다" 로 보인다.
    #
    # true 면 지평에서 스케일 1.0(감속 없음), 간격 0 에서 trailing_speed_scale
    # 까지 선형 보간한다. 상대가 보이는 순간부터 완만히 빼기 시작하되 깊은
    # 감속은 실제로 필요한 근거리에 쓴다. 제동거리는 속도의 제곱이라, 스케일이
    # 절반만 내려가도 이득의 대부분이 확보된다.
    trailing_speed_ramp: true
    # [m/s] Floor under trailing_speed_scale * raceline_speed (tight corners have a
    # low raceline speed already; don't let the cap crawl toward 0 there).
    trailing_min_speed_mps: 1.0
    ftg_speed_mps: 0.1
    ftg_timer_sec: 3.0
    ftg_active: false
    force_GBTRACK: false
    use_force_trailing: false
